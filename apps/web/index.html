<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duepuntozero Aste Dashboard</title>
    <!-- Icons are their own assets, deliberately not /logo.png: that file is
         also the in-app header mark (Shell.tsx) and is navy-on-transparent,
         which iOS renders as navy-on-BLACK on the home screen. These are
         white-on-navy with a solid background, so one artwork serves the
         browser tab and the iPhone home screen alike. -->
    <!-- /favicon.ico is listed first and exists as a real file on purpose:
         browsers request that exact path on their own, tag or no tag, and the
         SPA rewrite would otherwise answer it with 200 + text/html — a valid
         response that some browsers cache, and a confusing one to debug. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Label under the iPhone home-screen icon. Without this iOS falls back
         to <title>, which is too long and gets truncated mid-word. -->
    <meta name="apple-mobile-web-app-title" content="Duepuntozero" />
    <script>
      (function () {
        // No-FOUC theme bootstrap (Phase 10): runs before any stylesheet
        // paints, so the correct `data-theme` is on <html> from the first
        // frame. Mirrors the persistence contract in src/lib/theme.ts —
        // an explicit stored choice always wins; absence of the key means
        // "follow the OS preference."
        try {
          var stored = localStorage.getItem('pvpdash.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          // localStorage/matchMedia unavailable (e.g. privacy mode) — fall
          // back to light, the CSS default with no attribute present.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
